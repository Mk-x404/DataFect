services:
  - type: web
    name: datafect-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOW_DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://datafect.vercel.app,https://frontend-vert-ten-27.vercel.app,https://frontend-mk-x404s-projects.vercel.app,http://localhost:5173"
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
